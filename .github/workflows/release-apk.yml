name: Release APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: release-apk
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version-file: .github/workflows/.java-version

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: recitation-web/package-lock.json

      - name: Cache Tilawa model
        uses: actions/cache@v6
        with:
          path: recitation-web/.cache
          key: tilawa-model-${{ hashFiles('recitation-web/src/model.json', 'recitation-web/package-lock.json') }}

      - name: Build Tilawa web bundle
        working-directory: recitation-web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      # Engine mit echtem Modell und echter Rezitation prüfen, bevor eine APK entsteht
      # ffmpeg nur für den Rezitationsteil; hängt apt, läuft der Test ohne ihn weiter
      - name: Smoke-Test Rezitationserkennung
        working-directory: recitation-web
        timeout-minutes: 8
        run: |
          command -v ffmpeg || timeout 120 sh -c 'sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg' || echo "ffmpeg nicht installiert"
          timeout 300 npm run smoke

      # APP_VERSION ist die Anzeige-Version aus app/build.gradle.kts; die Build-Nummer wird zum
      # Android-versionCode (4000 + Nummer), so zählt jeder Build hoch und installiert als Update.
      - name: Build info
        run: |
          # Build-Start, deutsche Zeit (MEZ/MESZ)
          echo "BUILD_DATE=$(TZ=Europe/Berlin date "+%Y-%m-%d %H:%M %Z")" >> "$GITHUB_ENV"
          version=$(sed -n 's/^ *versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          if [ -z "$version" ]; then echo "::error::versionName nicht in app/build.gradle.kts gefunden."; exit 1; fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((4000 + ${{ github.run_number }}))" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew assembleMadaniRelease -PdisableFirebase -PappVersionCode="$VERSION_CODE"

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/madani/release/app-madani-release.apk "out/QuranApp-${APP_VERSION}.apk"
          ls -lh out

      # Das feste Release „latest“ wird bei jedem Build neu angelegt: Link bleibt gleich,
      # alte Assets und das alte Tag verschwinden.
      - name: Replace release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # alte nummerierte Releases (build-N) aufräumen
          gh release list --limit 100 --json tagName --jq '.[].tagName' \
            | grep -v '^latest$' \
            | xargs -r -n1 gh release delete --cleanup-tag --yes
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest out/*.apk \
            --target "$GITHUB_SHA" \
            --title "${APP_VERSION} (Build ${{ github.run_number }}, ${BUILD_DATE})" \
            --prerelease \
            --notes "Automatischer Build von \`main\` — Commit ${GITHUB_SHA}
          Version: ${APP_VERSION} (Build ${{ github.run_number }})
          Stand: ${BUILD_DATE}

          Fester Link auf diese Seite (zeigt immer den neuesten Build):
          https://github.com/${GITHUB_REPOSITORY}/releases/tag/latest"
