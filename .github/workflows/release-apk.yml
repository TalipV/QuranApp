name: Release APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: release-apk
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version-file: .github/workflows/.java-version

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        run: >
          ./gradlew assembleMadaniRelease
          -PdisableFirebase
          -PSTORE_FILE="$RUNNER_TEMP/release.jks"
          -PSTORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}"
          -PKEY_ALIAS="${{ secrets.KEY_ALIAS }}"
          -PKEY_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}"

      - name: Prepare APK
        id: apk
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          NAME="QuranApp-${{ github.run_number }}-${SHORT_SHA}.apk"
          cp app/build/outputs/apk/madani/release/app-madani-release.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=build-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.apk.outputs.tag }}" "${{ steps.apk.outputs.name }}" \
            --target "$GITHUB_SHA" \
            --title "Build ${{ github.run_number }}" \
            --notes "$(git log -1 --pretty=format:'%s%n%n%h')" \
            --latest

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
