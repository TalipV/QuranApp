name: Release APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: release-apk
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version-file: .github/workflows/.java-version

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: recitation-web/package-lock.json

      - name: Cache Tilawa model
        uses: actions/cache@v6
        with:
          path: recitation-web/.cache
          key: tilawa-assets-${{ hashFiles('recitation-web/assets.json') }}

      - name: Build Tilawa web bundle
        working-directory: recitation-web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Check signing secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secrets KEYSTORE_BASE64/KEYSTORE_PASSWORD/KEY_ALIAS fehlen – es wird nur eine Debug-APK als Artefakt gebaut, kein Release."
          fi

      - name: Build debug APK (ohne Signing-Secrets)
        if: steps.signing.outputs.available != 'true'
        run: ./gradlew assembleMadaniDebug

      - name: Upload debug APK
        if: steps.signing.outputs.available != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: app/build/outputs/apk/madani/debug/*.apk
          retention-days: 7

      - name: Decode keystore
        if: steps.signing.outputs.available == 'true'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        if: steps.signing.outputs.available == 'true'
        run: >
          ./gradlew assembleMadaniRelease
          -PdisableFirebase
          -PSTORE_FILE="$RUNNER_TEMP/release.jks"
          -PSTORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}"
          -PKEY_ALIAS="${{ secrets.KEY_ALIAS }}"
          -PKEY_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}"

      - name: Prepare APK
        if: steps.signing.outputs.available == 'true'
        id: apk
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          NAME="QuranApp-${{ github.run_number }}-${SHORT_SHA}.apk"
          cp app/build/outputs/apk/madani/release/app-madani-release.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=build-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: steps.signing.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.apk.outputs.tag }}" "${{ steps.apk.outputs.name }}" \
            --target "$GITHUB_SHA" \
            --title "Build ${{ github.run_number }}" \
            --notes "$(git log -1 --pretty=format:'%s%n%n%h')" \
            --latest

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
