name: Release APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: release-apk
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version-file: .github/workflows/.java-version

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: recitation-web/package-lock.json

      - name: Cache Tilawa model
        uses: actions/cache@v6
        with:
          path: recitation-web/.cache
          key: tilawa-assets-${{ hashFiles('recitation-web/assets.json') }}

      - name: Build Tilawa web bundle
        working-directory: recitation-web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Build release APK
        run: ./gradlew assembleMadaniRelease -PdisableFirebase

      - name: Prepare APK
        id: apk
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          NAME="QuranApp-${{ github.run_number }}-${SHORT_SHA}.apk"
          cp app/build/outputs/apk/madani/release/app-madani-release.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=build-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.apk.outputs.tag }}" "${{ steps.apk.outputs.name }}" \
            --target "$GITHUB_SHA" \
            --title "Build ${{ github.run_number }}" \
            --notes "$(git log -1 --pretty=format:'%s%n%n%h')" \
            --latest
