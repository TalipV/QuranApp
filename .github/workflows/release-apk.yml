name: Release APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: release-apk
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version-file: .github/workflows/.java-version

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: recitation-web/package-lock.json

      - name: Cache Tilawa model
        uses: actions/cache@v6
        with:
          path: recitation-web/.cache
          key: tilawa-model-${{ hashFiles('recitation-web/src/model.json', 'recitation-web/package-lock.json') }}

      - name: Build Tilawa web bundle
        working-directory: recitation-web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      # Engine mit echtem Modell und echter Rezitation prüfen, bevor eine APK entsteht
      - name: Smoke-Test Rezitationserkennung
        working-directory: recitation-web
        run: |
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          npm run smoke

      - name: Build release APK
        run: ./gradlew assembleMadaniRelease -PdisableFirebase

      - name: Prepare APK
        run: cp app/build/outputs/apk/madani/release/app-madani-release.apk QuranApp.apk

      # Nur ein Release mit festem Namen: alter wird ersetzt, Link bleibt gleich
      - name: Replace release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # alte nummerierte Releases (build-N) aufräumen
          gh release list --limit 100 --json tagName --jq '.[].tagName' \
            | grep -v '^latest$' \
            | xargs -r -n1 gh release delete --cleanup-tag --yes
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest QuranApp.apk \
            --target "$GITHUB_SHA" \
            --title "QuranApp" \
            --notes "Build ${{ github.run_number }} · $(git log -1 --pretty=format:'%h %s')" \
            --latest
