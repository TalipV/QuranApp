# Private App: Release-APKs werden mit einem festen Debug-Keystore signiert
# (Standardpasswort "android", kein Geheimnis). Gleicher Schlüssel = Updates
# lassen sich ohne Deinstallation drüberinstallieren.
STORE_FILE=../signing/debug.keystore
STORE_PASSWORD=android
KEY_ALIAS=androiddebugkey
KEY_PASSWORD=android
